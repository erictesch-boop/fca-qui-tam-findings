                border: 0;

                color: #1a2330;

                border-color: #9b1b2e;

                height: 20px;
                opacity: 70%;
                padding: 12px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
                filter: invert(1);

                border: 0;

                padding: 13px;
                color: #ffffff;
                font-size: 13px;
                font-weight: 650;
                cursor: pointer;
                font-family: inherit;
