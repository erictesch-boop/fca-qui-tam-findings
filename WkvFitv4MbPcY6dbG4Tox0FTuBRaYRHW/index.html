        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />

        <style>
            html, body.staticrypt-body {
                height: 100%;
                margin: 0;
                background: #0b1017;
            }
            .staticrypt-html { height: 100%; }
            .staticrypt-content {
                height: 100%;
                margin: 0;
                background: #0b1017;
                font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
                color: #e8edf4;
            }
            .staticrypt-page {
                width: 100%;
                max-width: 400px;
                padding: 12vh 1.25rem 3rem;
                margin: 0 auto;
                box-sizing: border-box;
            }
            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #141a24;
                max-width: 400px;
                margin: 0 auto;
                padding: 2rem 1.6rem 1.7rem;
                text-align: center;
                border: 1px solid #2a3344;
                border-radius: 12px;
                box-shadow: 0 1px 2px rgba(0,0,0,0.28), 0 0 0 1px rgba(255,255,255,0.03);
            }
            .staticrypt-instructions { margin: 0 0 1.15rem; }
            .staticrypt-title {
                font-size: 1.15rem;
                font-weight: 650;
                letter-spacing: -0.02em;
                margin: 0 0 0.35rem;
                color: #e8edf4;
            }
            .staticrypt-instructions p { margin: 0; color: #8d96a6; font-size: 0.9rem; }
            .staticrypt-hr {
                margin: 0 0 1.15rem;
                border: 0;
                border-top: 1px solid #2a3344;
            }
            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #1b2230;
                width: 100%;
                border: 1px solid #2a3344;
                border-radius: 8px;
                margin: 0 0 0.85rem;
                box-sizing: border-box;
            }
            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: transparent;
                border: 0;
                box-sizing: border-box;
                font-size: 14px;
                outline: 0;
                padding: 14px 40px 14px 14px;
                width: 100%;
                color: #e8edf4;
                font-family: inherit;
            }
            .staticrypt-form input[type="password"]:focus,
            input[type="text"]:focus {
                outline: none;
            }
            .staticrypt-password-container:focus-within {
                border-color: #9b1b2e;
                box-shadow: 0 0 0 2px rgba(155, 27, 46, 0.35);
            }
            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 70%;
                padding: 12px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
                filter: invert(1);
            }
            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                letter-spacing: 0.06em;
                outline: 0;
                background: #9b1b2e;
                width: 100%;
                border: 0;
                border-radius: 8px;
                padding: 13px;
                color: #ffffff;
                font-size: 13px;
                font-weight: 650;
                cursor: pointer;
                font-family: inherit;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #9b1b2e;
                filter: brightness(112%);
            }
            .staticrypt-form .staticrypt-decrypt-button:focus-visible {
                outline: 2px solid #f3c5cb;
                outline-offset: 2px;
            }
            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
                color: #8d96a6;
                font-size: 0.85rem;
            }
            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.15);
                margin-right: 0.7em;
            }
            .hidden { display: none !important; }
            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #0b1017;
            }
            .staticrypt-spinner {
                display: inline-block;
                width: 1.6rem;
                height: 1.6rem;
                border: 0.2em solid #2a3344;
                border-right-color: #9b1b2e;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }
            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] { font-size: 16px; }
            }
        </style>

                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            // handle password form submission
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    alert(templateError);
                }
            });
        </script>
    </body>
</html>
